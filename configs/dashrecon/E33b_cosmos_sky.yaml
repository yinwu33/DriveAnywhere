# E33b (docs/EXPERIMENTS.md): E33 from the sky-completed E5f (results/E5fs, scripts/complete_sky.py): the untrained grey
# sky texels count as 'sky', not holes, so E33 fed the grey band to Cosmos under the vis / depth controls and kept it
# (user, 10-03: half grey, half sky when turning). Sky completion now comes first; everything else as E33.
exp: E33b
init_label: E5fs
scene_id: val056
init_log_dir: results/E5fs/val056
output_dir: results/E33b/val056
# view gate (D-A3)
mesh_ply: data/dashrecon/val056/pose-glomap_depth-mapanything__mask-gsam2_sky-segformer_img-glomap/mesh_nksr.ply
gate_mesh_distance: 0.3
gate_margin_deg: 15
gate_fade_deg: 15
gate_cone_min_weight: 0.5
gate: null                  # computed from init_log_dir (stage "gate")
prior_views_dirs: []        # earlier runs' generated views as GEN3C / validation memory
prior_validation_dirs: []
# target views: the whole drive, every 2nd frame, turned to the round's yaw over the first 20 views (as E10)
moves: ["yaw=45", "yaw=-45"]
frame_stride: 2
ramp_frames: 20
render_hw: [704, 1280]
src_offsets: [0, 6, 15, 30, 60, 90]
generator: cosmos
fps: 10
cosmos_prompt: "Dashcam footage of a quiet residential street in Phoenix, Arizona on a sunny day: single-story houses with low walls and gravel yards, parked cars along the curb, desert trees and shrubs, a clear blue sky; photorealistic, steady camera."
cosmos_guidance: 3
cosmos_steps: 35
cosmos_vis_weight: 0.5
cosmos_depth_weight: 0.5
cosmos_sigma_max: null      # Cosmos' default noise level for the input video
# GEN3C (as E13)
generation_steps: 35
generation_seed: 1
memory_radius: 16
max_memory_candidates: 6
generation_extra_args: [--speckle, drop, --speckle_window, "15", --speckle_density, "0.5"]   # D-C2
cache_preview: false        # the generation writes buffers.mp4 too
# holes after generation: generated sky (SegFormer-B5 Cityscapes, Phase 4 backend) stays sky
seg_model_id: nvidia/segformer-b5-finetuned-cityscapes-1024-1024
seg_input_hw: [768, 1344]
sky_alpha: 0.5
holes_extra_args: [--exclude_classes, person, rider, car, truck, bus, train, motorcycle, bicycle]   # D-C2
# depth of the generated frames (D-B1): MapAnything jointly over each round's frames, scene-global scale per round
depth_model_id: facebook/map-anything
depth_extra_args: [--poses_metric]   # D-B2
# validation (as E13)
min_baseline_scene_units: 1.0
min_parallax_degrees: 0.5
max_references: 4
depth_tolerance: 0.10
rgb_tolerance: 0.12
min_support: 2
max_conflict_fraction: 0.25
# distillation
optimization_steps: 4000
optimization_seed: 0
spawn_stride: 3
pixel_stride: 3
unknown_w: 0.3
round_affine_reg: 1.0
train_extra_args: []        # no --protect_from: E17b brought the gated junk back
diagnostic_indices: [10, 30, 50, 70, 90]
# evaluation
gt_root: data/waymo/processed/validation
unseen_dir: results/E5c/val056/cross_camera_p9/unseen
compare_log_dirs: [results/E20/val056/model, results/E23/val056/model]
compare_labels: [E20_gen, E23_gen]
realism_compare:            # D-E1 renders (realism2/) of earlier runs, compared with this run's
  E5f: results/E5f/val056
  E20: results/E20/val056/model
  E23: results/E23/val056/model
  E33: results/E33/val056/model
rig_frames: [96, 104, 112]
rig_yaws: [-180, -135, -90, -45, 0, 45, 90, 135, 180]
rig_rights_scene_units: [0, 0.5]
