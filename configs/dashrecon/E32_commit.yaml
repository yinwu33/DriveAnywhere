# E32 (docs/EXPERIMENTS.md, docs/PLAN_AFTER_E30.md): E23's start and Fixer, with the progressive commit instead of E23's pool:
# the Fixer target only on holes (pixels no real or committed view saw), the envelope of the DECISIONS Z range grown in
# 4 stages (each stage's last views committed as memory), and an opacity binarisation term against the haze.
exp: E32
scene_id: val056
output_root: results
init_log_dir: results/E20/val056/model
init_gate: null                  # E20 carries its own view gate
output_dir: results/E32/val056
yaw_choices: []                  # the commit stages draw their own pool
steps: 8000                      # as E23: 32 refreshes of 250 steps, 8 per stage; Fixer timestep 250, gen_w 0.5, lpips_w 0.2
method: fixer                    # scripts/train_fixer.py
seed: 0
# envelope = DECISIONS Z (yaw 45 deg, lateral 3 m, up 2 m) in scene units with D-G1's non-GT metre estimate for val056:
# DA3 depth / our depth = 1.728, so 1 m ~ 0.579 scene units (the GT says 0.430; DA3 overestimates by ~35 %)
train_extra_args: [--commit_stages, "4", --env_yaw, "45", --env_lateral, "1.74", --env_up, "1.16", --bin_w, "0.05"]
# evaluation
gt_root: data/waymo/processed/validation
unseen_dir: results/E5c/val056/cross_camera_p9/unseen
realism_compare:
  E5f: results/E5f/val056
  E23: results/E23/val056/model
  E30: results/E30/val056/model
seg_model_id: nvidia/segformer-b5-finetuned-cityscapes-1024-1024
rig_init_log_dir: results/E5f/val056
rig_init_label: E5f
rig_compare:
  E23_gen: results/E23/val056/model
  E30_gen: results/E30/val056/model
rig_frames: [96, 104, 112]
rig_yaws: [-180, -135, -90, -45, 0, 45, 90, 135, 180]
rig_rights_scene_units: [0, 0.5]
