# E36 (docs/EXPERIMENTS.md, PLAN_AFTER_E30 R1): no generator. From E5f, the novel views of the DECISIONS Z envelope are
# supervised by the real FRONT pixels that saw their surface points (pseudo multi-view), on those pixels only: does real
# texture alone remove the haze of the observed-but-oblique content at yaw 20-45?
exp: E36
scene_id: val056
output_root: results
init_log_dir: results/E5f/val056
init_gate: null                  # no view gate: E5f as trained
output_dir: results/E36/val056
yaw_choices: []                  # the commit stages draw their own pool
steps: 6000                      # 24 refreshes of 250 steps, one stage = uniform envelope; gen_w 0.5, lpips_w 0.2 as E23
method: fixer                    # scripts/train_fixer.py
seed: 0
# envelope = DECISIONS Z (yaw 45 deg, lateral 3 m, up 2 m) in scene units with D-G1's non-GT metre estimate for val056:
# DA3 depth / our depth = 1.728, so 1 m ~ 0.579 scene units (the GT says 0.430; DA3 overestimates by ~35 %)
train_extra_args: [--commit_stages, "1", --env_yaw, "45", --env_lateral, "1.74", --env_up, "1.16", --target, real]
# evaluation
gt_root: data/waymo/processed/validation
unseen_dir: results/E5c/val056/cross_camera_p9/unseen
realism_compare:
  E5f: results/E5f/val056
  E23: results/E23/val056/model
  E32: results/E32/val056/model
seg_model_id: nvidia/segformer-b5-finetuned-cityscapes-1024-1024
rig_init_log_dir: results/E5f/val056
rig_init_label: E5f
rig_compare:
  E23_gen: results/E23/val056/model
  E32_gen: results/E32/val056/model
rig_frames: [96, 104, 112]
rig_yaws: [-180, -135, -90, -45, 0, 45, 90, 135, 180]
rig_rights_scene_units: [0, 0.5]
