# E23 (docs/EXPERIMENTS.md): E19 with every direction in one Fixer pool (E22: fixing the rear after the sides undid the sides).
exp: E23
scene_id: val056
output_root: results
init_log_dir: results/E20/val056/model
init_gate: null                  # E20 carries its own view gate
output_dir: results/E23/val056
yaw_choices: [45, -45, 90, -90, 135, -135, 180]   # pool views turned to one of these (+- 3 degree jitter), no sideways move
steps: 8000                      # 7 directions instead of E19's 4; E7's defaults otherwise: refresh every 250 steps, Fixer timestep 250, gen_w 0.5, lpips_w 0.2
method: fixer                    # scripts/train_fixer.py
seed: 0
train_extra_args: []             # appended to train_fixer.py
# evaluation
gt_root: data/waymo/processed/validation
unseen_dir: results/E5c/val056/cross_camera_p9/unseen
realism_compare:
  E5f: results/E5f/val056
  E19: results/E19/val056/model
  E22: results/E22/val056/model
seg_model_id: nvidia/segformer-b5-finetuned-cityscapes-1024-1024
rig_init_log_dir: results/E5f/val056
rig_init_label: E5f
rig_compare:
  E19_gen: results/E19/val056/model
  E22_gen: results/E22/val056/model
rig_frames: [96, 104, 112]
rig_yaws: [-180, -135, -90, -45, 0, 45, 90, 135, 180]
rig_rights_scene_units: [0, 0.5]
