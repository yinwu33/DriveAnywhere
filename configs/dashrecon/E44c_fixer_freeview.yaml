# E44c (docs/EXPERIMENTS.md): E29's free-view Fixer pool (any yaw, sideways +-3, up 0-2, pitch -15..5) on E44b: third stage
# of E35's recipe on E41 (E30's sky fit is skipped: E41s is sky-completed; complete_sky.py follows).
exp: E44c
scene_id: val056
output_root: results
init_log_dir: results/E44b/val056/model
init_gate: null                  # E44b carries E44a's view gate
output_dir: results/E44c/val056
yaw_choices: []                  # --yaw_uniform below
steps: 6000                      # on top of E44b; E7's defaults otherwise
method: fixer                    # scripts/train_fixer.py
seed: 0
train_extra_args: [--yaw_uniform, --up_range, "0", "2", --pitch_range, "-15", "5",
                   --off_lo_start, "0", --off_hi_start, "3", --off_lo_end, "0", --off_hi_end, "3"]   # appended (later values win)
# evaluation
gt_root: data/waymo/processed/validation
unseen_dir: results/E5c/val056/cross_camera_p9/unseen
realism_compare:
  E41s: results/E41s/val056
  E29: results/E29/val056/model
seg_model_id: nvidia/segformer-b5-finetuned-cityscapes-1024-1024
rig_init_log_dir: results/E41s/val056
rig_init_label: E41s
rig_compare:
  E29_gen: results/E29/val056/model
rig_frames: [96, 104, 112]
rig_yaws: [-180, -135, -90, -45, 0, 45, 90, 135, 180]
rig_rights_scene_units: [0, 0.5]
